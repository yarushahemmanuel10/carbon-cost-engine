[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-cost-engine"
version = "0.1.0"
description = "A small learning prototype that links embodied carbon (A1-A3) to a cost plan."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
carbon-cost-ingest-ice = "carbon_cost.ingest.ice:main"
carbon-cost-load-densities = "carbon_cost.ingest.densities:main"
carbon-cost-import-project = "carbon_cost.ingest.project:main"

[tool.setuptools.packages.find]
include = ["carbon_cost*"]

[tool.setuptools.package-data]
carbon_cost = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
